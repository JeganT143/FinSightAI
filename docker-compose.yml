services:
  db:
    image: pgvector/pgvector:pg17
    container_name: finsight-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight} -d ${POSTGRES_DB:-finsight}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["full"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finsight-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@db:5432/${POSTGRES_DB:-finsight}
      CORS_ORIGINS: '["http://localhost:3000"]'
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-disabled}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Mirrors the image HEALTHCHECK so `depends_on: service_healthy` works
    # for the frontend: healthy = migrations applied + Postgres reachable.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finsight-worker
    command: ["arq", "backend.worker.WorkerSettings"]
    healthcheck:
      # The image's HEALTHCHECK probes the API port; the worker serves no HTTP.
      disable: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@db:5432/${POSTGRES_DB:-finsight}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # Backend runs migrations on start; the worker must not race them.
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: frontend/web
      dockerfile: Dockerfile
      args:
        # Inlined at build time; empty = auth disabled (dev parity).
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # Inlined at build time; empty/unset = pricing & upgrade UI hidden.
        NEXT_PUBLIC_BILLING_ENABLED: ${NEXT_PUBLIC_BILLING_ENABLED:-}
    container_name: finsight-frontend
    environment:
      # Server-side proxy target inside the compose network
      BACKEND_URL: http://backend:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["full"]

volumes:
  finsight_pgdata:

[project]
name = "finsightai"
version = "0.2.0"
description = "Multi-agent equity research platform with adversarial critique, SEC-filing RAG, and full-run observability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "lxml>=6.0.0",
    "numpy>=2.2.0",
    "openai>=2.37.0",
    "openai-agents>=0.17.4",
    "pgvector>=0.4.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.50",
    "stripe>=15.3.1",
    "tiktoken>=0.9.0",
    "uvicorn>=0.49.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
    "streamlit>=1.58.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
markers = [
    "llm_eval: evals that call the OpenAI API (cost money; run explicitly with -m llm_eval)",
]
addopts = "-m 'not llm_eval'"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# yfinance ships no type stubs; its results are normalized into typed dicts
# at the tool boundary (backend/tools/market.py), so untyped internals are contained.
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

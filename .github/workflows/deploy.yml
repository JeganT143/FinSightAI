# Deploy to Azure Container Apps (SAAS §11, Azure adaptation).
#
# Manual trigger on purpose: a portfolio project deploys deliberately, not on
# every merge. Images go to GHCR (free); Azure login uses OIDC federated
# credentials — no long-lived cloud secrets in GitHub.
#
# Required repository secrets:
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID  (OIDC app reg)
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  (inlined into the web bundle at build)
# Required repository variables:
#   AZURE_RESOURCE_GROUP (e.g. finsightai-rg)
#   NEXT_PUBLIC_API_URL  (e.g. https://api.finsightai.jegant.dev)
#   NEXT_PUBLIC_BILLING_ENABLED  ("true" once Stripe is configured; unset/empty hides pricing & upgrade UI)

name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC federation with Azure

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/finsightai-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/finsightai-web

jobs:
  build-push:
    name: Build + push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BILLING_ENABLED=${{ vars.NEXT_PUBLIC_BILLING_ENABLED }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Roll Container Apps to the new images
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n finsight-api \
            --image "${{ env.API_IMAGE }}:${{ needs.build-push.outputs.tag }}"

      - name: Update web
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n finsight-web \
            --image "${{ env.WEB_IMAGE }}:${{ needs.build-push.outputs.tag }}"

      - name: Smoke check
        run: |
          FQDN=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n finsight-api \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/health/ready" || true)
            [ "$code" = "200" ] && echo "ready" && exit 0
            echo "waiting ($code)..."; sleep 10
          done
          echo "API never became ready" && exit 1

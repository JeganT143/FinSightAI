name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

# Superseded runs on the same branch are wasted compute — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, format, types, tests, deterministic evals
    runs-on: ubuntu-latest
    env:
      # Dummies: unit tests run on SQLite and never call OpenAI (ADR-9).
      OPENAI_API_KEY: ci-dummy-key
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check backend tests evals

      - name: Format (ruff format --check)
        run: uv run ruff format --check backend tests evals

      - name: Type check (mypy)
        run: uv run mypy backend

      - name: Unit tests + deterministic evals (with coverage gate)
        run: uv run pytest tests evals -q --cov=backend --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker — both images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  audit:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # pip-audit resolves its own throwaway env and can land on a Python
      # version with no prebuilt lxml wheel yet, forcing a source build.
      - name: Install lxml build headers (fallback if pip-audit builds from source)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Audit Python dependencies (pip-audit against the lockfile)
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit frontend production dependencies
        working-directory: frontend/web
        run: npm audit --omit=dev --audit-level=high
